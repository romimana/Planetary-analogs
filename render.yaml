services:
  - type: web
    name: planetary-analogs
    runtime: python
    plan: free
    buildCommand: python -m py_compile serve_app.py
    startCommand: python serve_app.py
    healthCheckPath: /api/explain
    autoDeployTrigger: off
    envVars:
      - key: ANALOGS_HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
